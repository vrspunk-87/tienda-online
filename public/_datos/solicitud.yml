activa: true
titulo: Mi solicitud de presupuesto
introduccion: Revisa los productos, indica cuántas unidades quieres de cada uno
  y envíanos tus datos. La tienda se pondrá en contacto contigo para confirmar
  disponibilidad y precio final. Enviar la solicitud no te obliga a comprar.
aceptacion: He leído y acepto las condiciones de la solicitud de presupuesto y
  la información sobre protección de datos.
info_privacidad: "Responsable: {titular}. Finalidad: responder a tu solicitud de
  presupuesto y, si se acuerda, gestionar la venta. Base legal: medidas
  precontractuales a petición tuya. Destinatarios: no se ceden datos salvo
  obligación legal; proveedores de alojamiento y correo (Cloudflare y Google).
  Derechos: acceso, rectificación, supresión y otros, en {correo}."
boton: Enviar solicitud
ventajas:
  - texto: "Sin compromiso: no pagas nada ahora"
    icono: check
  - texto: Puedes verlo antes en la tienda
    icono: tienda
preferencia_contacto:
  mostrar: true
  pregunta: ¿Cómo prefieres que te contestemos?
  opciones:
    - llamada
    - whatsapp
    - correo
accesorios: true
notas: true
mensaje_exito: ¡Solicitud enviada! Te hemos mandado un correo con el resumen. La
  tienda se pondrá en contacto contigo en breve para confirmarte la
  disponibilidad y el precio final.
acuse:
  asunto: Hemos recibido tu solicitud de presupuesto
  texto: Gracias por tu solicitud de presupuesto. La tienda la revisará y se
    pondrá en contacto contigo en breve para confirmarte la disponibilidad y el
    precio final.
limites:
  por_hora: 30
  avisos_dia: 40
  acuses_dia: 45
  max_productos: 30
