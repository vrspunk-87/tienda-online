pagina_catalogo:
  descripcion: Máquinas de coser domésticas e industriales, bordadoras y
    accesorios en Zafra. Consulta precios orientativos y pide tu presupuesto sin
    compromiso.
  texto: >-
    En Máquinas de Coser Zafra reunimos todo lo que necesitas para coser y
    bordar: desde tu primera máquina doméstica hasta equipos industriales para
    talleres, bordadoras de uno o varios cabezales y los accesorios que marcan
    la diferencia en cada labor.


    Elige un tipo de producto para empezar o echa un vistazo a nuestras ofertas. Añade a tu solicitud lo que te interese y te preparamos un presupuesto ajustado, sin compromiso. ¿Tienes dudas? Te asesoramos para que aciertes a la primera.
  productos:
    mostrar: true
    por_pagina: 12
  ofertas:
    mostrar: false
    por_pagina: 12
  blog:
    mostrar: true
    por_pagina: 3
pagina_ofertas:
  descripcion: Máquinas de coser, bordadoras y accesorios con precio rebajado
    durante unos días. Aprovecha nuestras ofertas y pide presupuesto sin
    compromiso.
  texto: >-
    Cada cierto tiempo rebajamos el precio de máquinas y accesorios
    seleccionados. Las ofertas duran unos días: en cada producto verás el precio
    rebajado, el descuento y la fecha en que termina.


    Navega por tipo de producto para encontrar las ofertas que te interesan, añádelas a tu solicitud de presupuesto y te confirmamos precio y disponibilidad.
  productos:
    por_pagina: 12
  blog:
    mostrar: true
    por_pagina: 3
