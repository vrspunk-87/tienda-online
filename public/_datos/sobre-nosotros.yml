provisional: true
antetitulo: Sobre nosotros
titulo: Toda una vida cosiendo en Zafra
texto: |-
  Somos una tienda familiar especializada en máquinas de coser. Empezamos vendiendo y arreglando máquinas a las costureras del pueblo y hoy atendemos también a talleres, tapiceros y escuelas de costura de toda la comarca.

  Nos gusta que te lleves la máquina que de verdad necesitas: te escuchamos, te enseñamos varias, la probamos contigo y, cuando ya la tienes en casa, seguimos aquí para lo que haga falta.
