<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquinas de Coser Zafra</title>
  <meta name="description" content="Máquinas de coser y accesorios en Zafra: catálogo con precios orientativos. Elige los productos que te interesan y solicita presupuesto.">
  <link rel="stylesheet" href="/css/tema.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <div id="cabecera"></div>

  <main class="flex-grow-1">
    <!-- Portada. Los textos con data-portada se editan en Decap → Ajustes del sitio → Portada (portada en public/_datos/sitio.yml) -->
    <section class="hero">
      <div class="container">
        <!-- A la izquierda, los textos y las ventajas; a la derecha, «Explora el catálogo» con los tipos
             de producto y su número de productos; debajo de los textos, el último artículo del blog.
             Los tipos, las ventajas y el artículo los pone el build (scripts/build.js, aplicarPortada).
             En el móvil: textos, catálogo y artículo, en ese orden. -->
        <div class="hero-rejilla">
          <div class="hero-texto">
            <p class="antetitulo" data-portada="hero.antetitulo">Máquinas de coser · Zafra</p>
            <h1 class="display-4 fw-bold" data-portada="hero.titulo">Máquinas de coser y accesorios</h1>
            <p class="lead text-body-secondary" data-portada="hero.texto">Consulta nuestro catálogo con precios orientativos y solicita presupuesto sin compromiso.</p>
            <div data-hero-ventajas></div>
          </div>
          <div data-hero-catalogo></div>
          <div data-hero-blog></div>
        </div>
      </div>
    </section>

    <!-- Bloques Catálogo, Ofertas y Blog: los genera el build (scripts/build.js, bloquesPortada)
         según Ajustes del sitio → Portada (si se muestran y cuántos por página), con el mismo
         estilo que en el catálogo: título con pespunte y, en los productos, la barra de filtros. -->
    <div data-bloques-portada></div>
  </main>

  <div id="pie"></div>

</body>
</html>
