<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>
body{font:13px Arial,sans-serif;margin:0;background:#fff;color:#202124}
.barra{background:#f1f3f4;padding:8px 12px;border-bottom:1px solid #dadce0;font-size:15px}
.barra b{font-size:16px}
.marca{display:inline-block;background:#fff3cd;border:1px solid #e0c36b;border-radius:4px;padding:2px 8px;margin-left:10px;font-size:12px}
table{border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #e2e3e3;padding:4px 6px;height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th.col{background:#f8f9fa;color:#5f6368;font-weight:normal;text-align:center;height:18px;font-size:11px}
td.num{background:#f8f9fa;color:#5f6368;text-align:center;width:28px}
tr.cab td{font-weight:bold;background:#e8f0fe}
.pest{position:sticky;left:0;display:flex;gap:2px;background:#f1f3f4;border-top:1px solid #dadce0;padding:4px 12px}
.pest span{padding:6px 14px;font-size:13px;color:#444}
.pest span.act{background:#fff;color:#1a73e8;border-bottom:3px solid #1a73e8;font-weight:bold}
.estado{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.Nueva{background:#e6f4ea;color:#137333}.Contactado{background:#e8f0fe;color:#1967d2}.Aceptada{background:#fce8b2;color:#7a5900}
.desp{position:absolute;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);border-radius:4px;padding:4px 0;font-size:13px}
.desp div{padding:6px 18px}.desp div.sel{background:#e8f0fe}
.flecha::after{content:" ▾";color:#5f6368}
.Rechazada{background:#fce8e6;color:#c5221f}.Enrevisión{background:#fef7e0;color:#b06000}</style></head><body>
